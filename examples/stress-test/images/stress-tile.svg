<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="480"
  viewBox="0 0 1200 480"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">MDX Preview stress-test tile</title>
  <desc id="desc">A dense grid of colored preview workload cells.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#164e63" />
    </linearGradient>
    <pattern id="cells" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="40" height="40" rx="7" fill="#ffffff" opacity="0.12" />
      <rect x="9" y="10" width="21" height="4" rx="2" fill="#67e8f9" opacity="0.9" />
      <rect x="9" y="20" width="30" height="3" rx="1.5" fill="#c4b5fd" opacity="0.7" />
      <rect x="9" y="29" width="25" height="3" rx="1.5" fill="#f9a8d4" opacity="0.7" />
    </pattern>
  </defs>
  <rect width="1200" height="480" rx="28" fill="url(#background)" />
  <rect x="28" y="28" width="1144" height="424" rx="20" fill="url(#cells)" />
  <rect x="76" y="168" width="1048" height="144" rx="24" fill="#020617" opacity="0.9" />
  <text
    x="600"
    y="226"
    fill="#f8fafc"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="44"
    font-weight="800"
    text-anchor="middle"
  >
    HEAVY MDX PREVIEW LOAD
  </text>
  <text
    x="600"
    y="274"
    fill="#a5f3fc"
    font-family="Consolas, Menlo, monospace"
    font-size="22"
    text-anchor="middle"
  >
    6,000+ source lines · 52 diagrams · 10,000 selectable cells
  </text>
</svg>
