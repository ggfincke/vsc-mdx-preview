<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="500"
  viewBox="0 0 900 500"
  role="img"
  aria-labelledby="title"
>
  <title id="title">Architecture Diagram</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bg)" />

  <!-- row 1: 3 boxes -->
  <rect x="60" y="50" width="200" height="80" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <text x="160" y="85" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)">Extension Host</text>
  <text x="160" y="105" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">ConfigManager | TrustMgr</text>

  <rect x="350" y="50" width="200" height="80" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <text x="450" y="85" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)">Compiler Pipeline</text>
  <text x="450" y="105" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">remark | rehype | shiki</text>

  <rect x="640" y="50" width="200" height="80" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <text x="740" y="85" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)">Module Resolver</text>
  <text x="740" y="105" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">shim | tsPath | enhanced</text>

  <!-- arrows row 1 -->
  <line x1="260" y1="90" x2="350" y2="90" stroke="rgba(255,255,255,0.3)" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="550" y1="90" x2="640" y2="90" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

  <!-- row 2: RPC bridge -->
  <rect x="200" y="180" width="500" height="50" rx="6" fill="rgba(99,102,241,0.3)" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="6 3" />
  <text x="450" y="210" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.7)">Comlink RPC Bridge</text>

  <!-- arrows to RPC -->
  <line x1="160" y1="130" x2="350" y2="180" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <line x1="450" y1="130" x2="450" y2="180" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <!-- row 3: webview components -->
  <rect x="60" y="280" width="160" height="70" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <text x="140" y="310" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)">SafePreview</text>
  <text x="140" y="328" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">DOMPurify | HTML</text>

  <rect x="260" y="280" width="160" height="70" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <text x="340" y="310" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)">TrustedPreview</text>
  <text x="340" y="328" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">React 19 | MDX eval</text>

  <rect x="460" y="280" width="160" height="70" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <text x="540" y="310" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.8)">ModuleRuntime</text>
  <text x="540" y="328" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">loadModule | registry</text>

  <rect x="660" y="280" width="180" height="70" rx="8" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)" stroke-width="1" />
  <text x="750" y="310" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)">Lightbox</text>
  <text x="750" y="328" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">zoom | pan | gallery</text>

  <!-- arrows to webview -->
  <line x1="350" y1="230" x2="140" y2="280" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <line x1="450" y1="230" x2="340" y2="280" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <line x1="550" y1="230" x2="540" y2="280" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <!-- row 4: bottom labels -->
  <rect x="200" y="400" width="500" height="45" rx="6" fill="rgba(255,255,255,0.05)" />
  <text x="450" y="428" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)">Webview Client (browser) -- React 19 + Vite 8 -- VS Code iframe sandbox</text>

  <!-- title -->
  <text x="450" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Zoom in to read the small labels</text>
</svg>
