<svg
  xmlns="http://www.w3.org/2000/svg"
  width="300"
  height="500"
  viewBox="0 0 300 500"
  role="img"
  aria-labelledby="title"
>
  <title id="title">Tall Portrait</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)" />
  <rect x="60" y="80" width="180" height="260" rx="12" fill="rgba(255,255,255,0.1)" />
  <rect x="80" y="100" width="140" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
  <rect x="80" y="120" width="100" height="8" rx="4" fill="rgba(255,255,255,0.15)" />
  <rect x="80" y="150" width="140" height="80" rx="8" fill="rgba(255,255,255,0.12)" />
  <rect x="80" y="245" width="60" height="24" rx="6" fill="rgba(255,255,255,0.2)" />
  <rect x="150" y="245" width="60" height="24" rx="6" fill="rgba(255,255,255,0.15)" />
  <text x="150" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="white">300 x 500</text>
  <text x="150" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">Tall Portrait</text>
</svg>
