<svg
  xmlns="http://www.w3.org/2000/svg"
  width="400"
  height="400"
  viewBox="0 0 400 400"
  role="img"
  aria-labelledby="title"
>
  <title id="title">Square</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" />
  <circle cx="200" cy="180" r="80" fill="url(#glow)" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  <circle cx="200" cy="180" r="50" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  <circle cx="200" cy="180" r="20" fill="rgba(255,255,255,0.15)" />
  <text x="200" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="white">400 x 400</text>
  <text x="200" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.7)">Square</text>
</svg>
