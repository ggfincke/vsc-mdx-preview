<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="600"
  viewBox="0 0 1200 600"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">MDX Preview Showcase</title>
  <desc id="desc">
    Decorative preview image showing code and rendered documentation panels.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#0f1a30" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)" />

  <rect x="70" y="70" width="1060" height="460" rx="18" fill="#020617" />
  <rect x="70" y="70" width="1060" height="460" rx="18" fill="url(#panel)" opacity="0.75" />
  <rect x="70" y="70" width="1060" height="460" rx="18" fill="none" stroke="#334155" />

  <rect x="70" y="70" width="1060" height="46" rx="18" fill="#111827" />
  <rect x="87" y="87" width="12" height="12" rx="6" fill="#fb7185" />
  <rect x="107" y="87" width="12" height="12" rx="6" fill="#fbbf24" />
  <rect x="127" y="87" width="12" height="12" rx="6" fill="#34d399" />
  <text x="170" y="101" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    MDX Preview - README.mdx
  </text>

  <rect x="108" y="150" width="430" height="330" rx="12" fill="#0f172a" stroke="#1e293b" />
  <rect x="566" y="150" width="526" height="330" rx="12" fill="#0b1324" stroke="#1e293b" />

  <text x="134" y="186" fill="#60a5fa" font-family="Consolas, Menlo, monospace" font-size="16">
    # MDX Preview Feature Showcase
  </text>
  <text x="134" y="214" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="14">
    &gt; [!TIP]
  </text>
  <text x="134" y="238" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="14">
    &gt; Trusted mode enables React components.
  </text>
  <text x="134" y="278" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="14">
    &lt;Calculator /&gt;
  </text>
  <rect x="134" y="302" width="360" height="1" fill="#334155" />
  <text x="134" y="334" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="14">
    - Syntax highlighting
  </text>
  <text x="134" y="358" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="14">
    - Mermaid diagrams
  </text>
  <text x="134" y="382" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="14">
    - Callouts and tabs
  </text>

  <text x="592" y="186" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">
    Live Preview
  </text>
  <rect x="592" y="208" width="180" height="6" rx="3" fill="url(#accent)" />

  <rect x="592" y="244" width="470" height="74" rx="10" fill="#12263a" stroke="#1d4ed8" />
  <text x="614" y="272" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
    Tip
  </text>
  <text x="614" y="297" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="16">
    Use Cmd+K X (Mac) or Ctrl+K X (Windows/Linux).
  </text>

  <rect x="592" y="336" width="220" height="122" rx="10" fill="#0f172a" stroke="#334155" />
  <rect x="830" y="336" width="232" height="122" rx="10" fill="#0f172a" stroke="#334155" />
  <text x="614" y="368" fill="#22d3ee" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
    TOC
  </text>
  <text x="614" y="392" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    React Components
  </text>
  <text x="614" y="414" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    Mermaid Diagrams
  </text>
  <text x="614" y="436" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    Lists and Tables
  </text>

  <text x="852" y="368" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
    Frontmatter
  </text>
  <text x="852" y="392" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    title: Feature Showcase
  </text>
  <text x="852" y="414" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    author: MDX Preview
  </text>
  <text x="852" y="436" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    tags: mdx, vscode
  </text>

  <text x="600" y="548" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">
    VS Code MDX Preview
  </text>
</svg>
