name: Bug Report
description: Report a bug with MDX Preview
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open an MDX file with ...
        2. Run command ...
        3. See error ...
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VS Code Version
      placeholder: "e.g., 1.95.0"
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension Version
      placeholder: "e.g., 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: rendering-mode
    attributes:
      label: Rendering Mode
      options:
        - Safe Mode
        - Trusted Mode
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: MDX Framework
      options:
        - None / Generic
        - Docusaurus
        - Starlight (Astro)
        - Nextra
        - Next.js
        - Other
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g., macOS 15.3, Windows 11, Ubuntu 24.04"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Logs, screenshots, or MDX content that demonstrates the issue.
    validations:
      required: false
