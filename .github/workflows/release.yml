name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/release-artifact.mjs exercise
      - name: Find a retained artifact before preparing bytes
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > "$RUNNER_TEMP/artifacts.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const artifacts = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/artifacts.json")).artifacts;
            const artifact = artifacts.find(item => item.name === "release-" + process.env.GITHUB_SHA);
            if (artifact?.expired) throw new Error("Retained release artifact expired; do not rebuild a partially published release");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "id=" + (artifact?.id ?? "") + "\n");
          '
      - uses: actions/download-artifact@v8
        if: steps.retained.outputs.id != ''
        with:
          artifact-ids: ${{ steps.retained.outputs.id }}
          path: ${{ runner.temp }}/release
      - name: Verify retained bytes
        if: steps.retained.outputs.id != ''
        run: node scripts/release-artifact.mjs verify "$RUNNER_TEMP/release" "${GITHUB_REF#refs/tags/v}"
      - name: Validate release and package the artifact once
        if: steps.retained.outputs.id == ''
        run: node scripts/release-artifact.mjs prepare "$RUNNER_TEMP/release"
      - id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.retained.outputs.id == ''
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Publish retained bytes and reconcile completed destinations
        run: node scripts/release-artifact.mjs publish "$RUNNER_TEMP/release" "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report destination status
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/release/publication.json"; then
            cat "$RUNNER_TEMP/release/publication.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Publication did not start; inspect artifact verification or setup failure.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: publication-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/publication.json
          if-no-files-found: warn
          retention-days: 90
