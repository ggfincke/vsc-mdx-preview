name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run linting
        run: npm run lint

      - name: Check dependency boundaries
        run: npm run deps:check

      - name: Check generated file locations
        run: npm run check:generated

      - name: Check formatting
        run: npm run format:check

      - name: Run type checking
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Check import.meta.url CJS shim
        run: npm run check:import-meta-shim

      - name: Bundle size check
        run: npm run size:report

      - name: Package extension
        run: npm run vscode:package -- --no-yarn

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-mdx-preview-${{ github.sha }}
          path: '*.vsix'
          retention-days: 7
